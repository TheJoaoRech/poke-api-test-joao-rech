<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <img src="https://encurtador.com.br/qgls" alt="Company Logo" class="header-logo">
                <h1 class="header-title"></h1>
            </div>
            <p class="header-welcome">Welcome! I'm João Rech, explore the Pokémon world by searching or clicking on a
                card below!</p>
        </header>

        <section class="search-section">
            <form class="search-form" id="searchForm">
                <input type="text" id="searchInput" placeholder="Search Pokémon by name or ID..." class="search-input">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </section>

        <div id="errorBanner" class="error-banner hidden">
            <p id="errorMessage"></p>
            <button class="error-close"
                onclick="document.getElementById('errorBanner').classList.add('hidden')">✕</button>
        </div>

        <main class="main-content">
            <div class="pokemon-list-header">
                <h2>Here are all the Pokémon available in our system:</h2>
            </div>
            <div id="pokemonGrid" class="pokemon-grid">
                <div class="loading">Loading...</div>
            </div>
        </main>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="prevBtn" class="pagination-btn">← Previous</button>
            <span class="pagination-info" id="paginationInfo"></span>
            <button id="nextBtn" class="pagination-btn">Next →</button>
        </div>

        <div id="pokemonModal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">✕</button>
                <div id="pokemonDetails"></div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>

</html>
